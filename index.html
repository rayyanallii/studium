<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101010" />
    <title>Studium — Your AI study workspace</title>
    <meta
      name="description"
      content="Turn your materials into AI flashcards, quizzes and source-grounded notebooks. Plan your studies and track your progress with Studium."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/studium-mark-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/studium-mark-192.png" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem('studium-theme') || 'dark'
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
